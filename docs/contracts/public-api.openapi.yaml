openapi: 3.0.3
info:
  title: TestPilot AI — Public REST API (I1)
  version: 1.0.0
  description: |
    Served by the Core Backend behind Nginx under the base path /api (M2 SAD §4.2).
    Every call except /auth/login carries `Authorization: Bearer <JWT>`.
    Every non-2xx response uses the ErrorResponse body (M2 §4.5).
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Obtain a JWT (simple login, D-05 / A-04)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    get:
      tags: [auth]
      summary: Current user and role
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /projects:
    get:
      tags: [projects]
      summary: List projects the user is a member of (Phase 1 addition)
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [projects]
      summary: Create a project (FR-01). Roles DEVELOPER, TEAM_LEAD.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [projects]
      summary: Project details (FR-01). Project members.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/requirements:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [requirements]
      summary: List requirements (FR-02). Project members.
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [requirements]
      summary: Add a requirement (FR-02). Role DEVELOPER.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequirementCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/tests/generate:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    post:
      tags: [tests]
      summary: Ask the AI for candidate tests, stored as DRAFT (FR-03). Roles DEVELOPER, QA_ASSISTANT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateTestsRequest' }
      responses:
        '201':
          description: Suggestions stored as DRAFT test cases
          content:
            application/json:
              schema:
                type: object
                required: [testIds]
                properties:
                  testIds: { type: array, items: { type: integer } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /projects/{projectId}/tests:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [tests]
      summary: List test cases and their status (FR-04). Project members.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TestCaseStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCasePage' }
    post:
      tags: [tests]
      summary: Add a test case manually, source MANUAL (Phase 1 addition; works while AI is down). Roles DEVELOPER, QA_ASSISTANT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseCreate' }
      responses:
        '201':
          description: Created as DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tests/{testId}:
    parameters: [ { $ref: '#/components/parameters/TestId' } ]
    get:
      tags: [tests]
      summary: Test case details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [tests]
      summary: Edit a test; version + 1 and status reset to DRAFT (FR-04, ADR-005). Roles DEVELOPER, QA_ASSISTANT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{testId}/approve:
    parameters: [ { $ref: '#/components/parameters/TestId' } ]
    post:
      tags: [approval]
      summary: Approve one specific version (FR-05). Roles DEVELOPER, TEAM_LEAD.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tests/{testId}/reject:
    parameters: [ { $ref: '#/components/parameters/TestId' } ]
    post:
      tags: [approval]
      summary: Reject a test case (FR-05). Roles DEVELOPER, TEAM_LEAD.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tests/{testId}/flags:
    parameters: [ { $ref: '#/components/parameters/TestId' } ]
    post:
      tags: [tests]
      summary: Flag an issue on a test (advisory, FR-04). Project members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResponse' }

  /executions:
    post:
      tags: [executions]
      summary: Start a run of approved tests (FR-06). Roles DEVELOPER, QA_ASSISTANT, TEAM_LEAD.
      description: Approval check and execution insert happen in one transaction (ASR-3). Returns immediately; the run is asynchronous (ASR-4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionCreate' }
      responses:
        '202':
          description: Accepted and queued
          content:
            application/json:
              schema:
                type: object
                required: [executionId, status]
                properties:
                  executionId: { type: string, format: uuid }
                  status: { type: string, enum: [QUEUED] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/QueueUnavailable' }

  /executions/{executionId}:
    parameters: [ { $ref: '#/components/parameters/ExecutionId' } ]
    get:
      tags: [executions]
      summary: Status and per-test results (FR-07). Polled by the UI (A-05).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/executions:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [executions]
      summary: Latest executions of a project, newest first (QAS-1, paginated)
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPage' }

  /executions/{executionId}/logs:
    parameters: [ { $ref: '#/components/parameters/ExecutionId' } ]
    get:
      tags: [executions]
      summary: Runner evidence (stdout, stderr, JUnit XML, runner log) (FR-08)
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePage' }

  /executions/{executionId}/tests/{executionTestId}/explanation:
    parameters:
      - { $ref: '#/components/parameters/ExecutionId' }
      - name: executionTestId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [executions]
      summary: AI explanation of a failed test, labelled as hypothesis (FR-09, C-10). Roles DEVELOPER, QA_ASSISTANT.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Explanation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /projects/{projectId}/coverage:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [reports]
      summary: Requirement-to-test coverage (FR-10, basic)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirements:
                    type: array
                    items:
                      type: object
                      properties:
                        requirementId: { type: integer }
                        title: { type: string }
                        approvedTestCount: { type: integer }
                        lastResult: { type: string, nullable: true }

  /projects/{projectId}/risks:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    get:
      tags: [reports]
      summary: Rule-based risk summary (FR-11, ADR-008)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  risks:
                    type: array
                    items:
                      type: object
                      properties:
                        rule: { type: string, enum: [FAILED_TEST, UNTESTED_REQUIREMENT, INTERRUPTED_RUN] }
                        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
                        refId: { type: string }
                        message: { type: string }

  /projects/{projectId}/reports:
    parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
    post:
      tags: [reports]
      summary: Generate a quality report (FR-12). Role TEAM_LEAD.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/{reportId}:
    get:
      tags: [reports]
      summary: Retrieve a quality report (FR-12)
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityReport' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { type: integer } }
    TestId: { name: testId, in: path, required: true, schema: { type: integer } }
    ExecutionId: { name: executionId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }

  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: AUTH_REQUIRED / INVALID_CREDENTIALS / TOKEN_EXPIRED
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: FORBIDDEN (role or project membership)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: TEST_NOT_APPROVED / VERSION_CONFLICT / INVALID_STATE
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    AiUnavailable:
      description: AI_UNAVAILABLE (timeout, provider error or circuit open). Core functions keep working (QAS-2).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    QueueUnavailable:
      description: QUEUE_UNAVAILABLE (broker down; no execution row is left in QUEUED)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, AUTH_REQUIRED, INVALID_CREDENTIALS, TOKEN_EXPIRED, FORBIDDEN, NOT_FOUND,
                     TEST_NOT_APPROVED, VERSION_CONFLICT, INVALID_STATE, AI_UNAVAILABLE, QUEUE_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string }
            details: { type: object, additionalProperties: true }
            correlationId: { type: string }

    Role: { type: string, enum: [DEVELOPER, QA_ASSISTANT, TEAM_LEAD, ADMIN] }
    TestCaseStatus: { type: string, enum: [DRAFT, APPROVED, REJECTED] }
    TestType: { type: string, enum: [NORMAL, BOUNDARY, NEGATIVE] }
    ExecutionStatus: { type: string, enum: [QUEUED, RUNNING, PASSED, FAILED, INTERRUPTED, CANCELLED] }
    TerminationReason: { type: string, enum: [COMPLETED, TIMEOUT, RUNNER_LOST, INVALID_REPORT, RESOURCE_LIMIT, CANCELLED_BY_USER, INTERNAL_ERROR] }
    TestResultStatus: { type: string, enum: [PASSED, FAILED, ERROR, SKIPPED, NOT_RUN] }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    IdResponse:
      type: object
      properties:
        id: { type: integer }

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
    Project:
      type: object
      properties:
        projectId: { type: integer }
        name: { type: string }
        description: { type: string }
        programmingLanguage: { type: string, enum: [Python] }
        testFramework: { type: string, enum: [pytest] }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Project' } }

    RequirementCreate:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 10000 }
    Requirement:
      type: object
      properties:
        requirementId: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    RequirementPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Requirement' } }

    GenerateTestsRequest:
      type: object
      required: [requirementId]
      properties:
        requirementId: { type: integer }
        testTypes:
          type: array
          items: { $ref: '#/components/schemas/TestType' }
          default: [NORMAL, BOUNDARY, NEGATIVE]
        codeUnderTest:
          type: string
          maxLength: 20000
          description: Optional code context; only sent to the LLM after redaction (C-07)

    TestCaseCreate:
      type: object
      required: [title, testCode, testType]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        testType: { $ref: '#/components/schemas/TestType' }
        testCode: { type: string, maxLength: 20000 }
        requirementIds: { type: array, items: { type: integer } }
    TestCaseUpdate:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        testType: { $ref: '#/components/schemas/TestType' }
        testCode: { type: string, maxLength: 20000 }
    TestCase:
      type: object
      properties:
        testCaseId: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        description: { type: string }
        testType: { $ref: '#/components/schemas/TestType' }
        source: { type: string, enum: [AI_GENERATED, MANUAL] }
        testCode: { type: string }
        status: { $ref: '#/components/schemas/TestCaseStatus' }
        version: { type: integer }
        requirementIds: { type: array, items: { type: integer } }
        approvedVersion: { type: integer, nullable: true }
        updatedAt: { type: string, format: date-time }
    TestCasePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/TestCase' } }
    ApprovalDecision:
      type: object
      required: [version]
      properties:
        version: { type: integer, description: 'The version the reviewer looked at. Must equal the current version, else 409 VERSION_CONFLICT.' }
        comment: { type: string, maxLength: 2000 }

    ExecutionCreate:
      type: object
      required: [projectId, testCaseIds]
      properties:
        projectId: { type: integer }
        testCaseIds: { type: array, minItems: 1, maxItems: 50, items: { type: integer } }
    Execution:
      type: object
      properties:
        executionId: { type: string, format: uuid }
        projectId: { type: integer }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        terminationReason: { $ref: '#/components/schemas/TerminationReason' }
        tests:
          type: array
          items:
            type: object
            properties:
              executionTestId: { type: integer }
              testCaseId: { type: integer }
              testCaseVersion: { type: integer }
              resultStatus: { $ref: '#/components/schemas/TestResultStatus' }
              durationMs: { type: integer, nullable: true }
              failureMessage: { type: string, nullable: true }
        requestedBy: { type: integer }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    ExecutionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Execution' } }
    EvidencePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  evidenceId: { type: integer }
                  evidenceType: { type: string, enum: [STDOUT, STDERR, JUNIT_XML, RUNNER_LOG] }
                  content: { type: string }
                  sizeBytes: { type: integer }
                  truncated: { type: boolean }
    Explanation:
      type: object
      properties:
        explanationId: { type: integer }
        explanationText: { type: string }
        aiGenerated: { type: boolean, enum: [true] }
        label: { type: string, example: 'AI-generated hypothesis — verify against the logs' }
        providerModel: { type: string }
        createdAt: { type: string, format: date-time }
    QualityReport:
      type: object
      properties:
        reportId: { type: integer }
        projectId: { type: integer }
        createdAt: { type: string, format: date-time }
        summary:
          type: object
          properties:
            totals: { type: object, additionalProperties: { type: integer } }
            coverage: { type: object }
            risks: { type: array, items: { type: object } }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
