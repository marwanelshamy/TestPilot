# Web UI container: serves the built SPA and forwards /api to the Core Backend (R1, R2).
# There is deliberately NO route to the AI service or RabbitMQ: the UI reaches them only through the
# Core Backend, which enforces login and the approval gate (M2 §3.1 "deliberately missing links").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://core-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_read_timeout 90s;   # > Core's AI client timeout (60 s), so AI errors reach the user as JSON
    }

    location / {
        try_files $uri /index.html;   # client-side routes (/projects/1, /executions/...)
    }
}
